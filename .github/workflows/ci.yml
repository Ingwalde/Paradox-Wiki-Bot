name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint, types and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check main.py paradox_bot/ tests/ scripts/
      - run: mypy
      # Known CVEs in what is pinned today. Dependabot is what moves the pins
      # forward; this is what fails the build when a pin goes bad in between.
      - run: pip-audit -r requirements.txt
      - name: Environment variables are documented
        run: python scripts/check_env_example.py
      - name: Version has a changelog entry
        run: python scripts/check_version_sync.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paradox
        ports:
          - 5432:5432
        # Wait for the database to accept connections before the tests run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The test suite's fixtures connect here; the same URL doubles as the
      # bot's own DATABASE_URL for any code that reads settings at import time.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/paradox
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/paradox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --cov=paradox_bot --cov-report=term-missing

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Only publish from main. Pull requests build and scan the image so a
      # broken Dockerfile or a new CVE fails review, but nothing reaches the
      # registry until it is merged.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          # Deploy pulls by sha- tag so the server runs the image built from the
          # commit CI validated, not whatever :latest points at by then.
          tags: |
            ghcr.io/ingwalde/paradox-wiki-bot:latest
            ghcr.io/ingwalde/paradox-wiki-bot:sha-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: only CVEs the project can actually act on fail the
      # build. The apt-get upgrade in deploy/Dockerfile is that action.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/ingwalde/paradox-wiki-bot:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/ingwalde/paradox-wiki-bot:latest
            ghcr.io/ingwalde/paradox-wiki-bot:sha-${{ github.sha }}
          cache-from: type=gha
