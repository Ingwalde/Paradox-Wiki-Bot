# Install once with: pip install pre-commit && pre-commit install
# ruff/mypy config lives in pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Must match mypy in requirements-dev.txt exactly; see the note there.
    rev: v1.20.2
    hooks:
      - id: mypy
        # The checked set lives in [tool.mypy] files in pyproject.toml. The
        # hook must not pass filenames of its own, or mypy resolves a staged
        # tests/*.py both as a bare module and as tests.<name> (imported by
        # other test files) and refuses with "found twice under different
        # module names".
        pass_filenames: false
        additional_dependencies:
          - discord.py>=2.4,<3.0
          - aiohttp>=3.9,<4.0
          - python-dotenv>=1.0,<2.0
          - SQLAlchemy[asyncio]>=2.0,<2.1
          - asyncpg>=0.29,<0.31
          - alembic>=1.13,<2.0

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Catches a committed .env or key before it ever reaches a remote.
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]
        # databases/*.db are legitimate tracked data (see scripts/import_wiki.py),
        # not accidental commits -- this is what should catch the next one.
        exclude: ^databases/
