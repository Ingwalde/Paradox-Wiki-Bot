name: paradox-bot

services:
  postgres:
    image: postgres:16-alpine
    container_name: paradox-postgres
    restart: unless-stopped
    # Credentials and database name come from .env — never hardcoded here — and
    # are shared with the bot, which builds its connection URL from the same
    # POSTGRES_* values.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paradox}
      POSTGRES_USER: ${POSTGRES_USER:-paradox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed on first boot only: the official image runs everything in
      # docker-entrypoint-initdb.d against an empty data directory, and it
      # understands .sql.gz. On an existing volume this is ignored. Regenerate
      # the dump with scripts/dump_seed.py.
      - ./databases/seed.sql.gz:/docker-entrypoint-initdb.d/seed.sql.gz:ro
    # Internal only — the bot reaches Postgres over the compose network. The
    # port is deliberately not published to the host.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paradox} -d ${POSTGRES_DB:-paradox}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  paradox-bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    # Deploy sets IMAGE_TAG to sha-<commit> so the server runs the exact image
    # CI validated. Unset — local `docker compose up --build` — it falls back
    # to :latest.
    image: ghcr.io/ingwalde/paradox-wiki-bot:${IMAGE_TAG:-latest}
    container_name: paradox-wiki-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Reach Postgres by its compose service name over the internal network.
      POSTGRES_HOST: postgres
      # Logs live on the volume below, not in the image layer, so they survive
      # a redeploy.
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"  # keep-alive/health, for host-side uptime monitoring
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Postgres startup plus Alembic migrations can take a while on a cold
      # volume; give the bot room before the first check counts against it.
      start_period: 40s

volumes:
  pgdata:
